name: Publish Userscript

on: 
  [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate independent shanten reference cases
        run: |
          python -m pip install mahjong==1.4.0
          python test/generate_shanten_reference.py test/shanten-reference.json

      - name: Run headless regression tests
        env:
          # The regression suite runs the full discard loop (real AI simulation), which measures
          # ~530ms/test on a GitHub runner. 250 was never achievable - it was set alongside FAST
          # mode, which the bundle job enables and this job does not, and it has failed since it
          # was introduced. 900 leaves runner headroom while still catching a real slowdown.
          ALPHAJONG_MAX_MS_PER_TEST: '900'
          ALPHAJONG_REFERENCE_FIXTURES: test/shanten-reference.json
        run: npm run test:headless

      - name: Run Mahjong Soul API contract tests
        run: npm run test:api

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Assemble userscript for bundle validation
        run: python build.py --no-bump

      - name: Run assembled userscript smoke tests
        env:
          ALPHAJONG_FAST: '1'
        run: npm run test:bundle

      - name: Run assembled userscript API and startup tests
        run: npm run test:bundle-api

      - name: Save validated userscript
        uses: actions/upload-artifact@v4
        with:
          name: validated-userscript
          path: AlphaJong.user.js

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-results/

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified

      - name: Run publish script
        run: python build.py

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-userscript
          path: |
            build/*.user.js

      - name: Commit and push AlphaJong.user.js for auto-updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AlphaJong.user.js
          git diff --cached --quiet || git commit -m "build: update AlphaJong.user.js [skip ci]"
          git push
