name: Android Experimental

on:
  push:
    branches: [Android-Experimentals]
  pull_request:
    paths: ['android/**', 'test/android_shell_tests.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and test Android
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify injection in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Save experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaJong-Android-Experimental-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Save Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  mobile-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Fetch the public release used by the app
        run: |
          mkdir -p build/android-public
          curl --fail --location --retry 2 --max-time 60 \
            https://raw.githubusercontent.com/Tsuki321/AlphaJong/master/AlphaJong.user.js \
            --output build/android-public/AlphaJong.user.js
          sha256sum build/android-public/AlphaJong.user.js
      - name: Verify page startup and mobile controls
        env:
          ALPHAJONG_UNITY_BUNDLE: build/android-public/AlphaJong.user.js
        run: node test/android_shell_tests.mjs
      - name: Verify the public script's Unity integration
        env:
          ALPHAJONG_UNITY_BUNDLE: build/android-public/AlphaJong.user.js
        run: node test/unity_integration_tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-browser-reports
          path: test-results/
